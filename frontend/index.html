<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Order Tracker - Track Order</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
</head>

<body>

<header class="app-header">
    <h1>Delivery Order Tracker</h1>
    <p>Enter your order number to see where your delivery is.</p>

    <nav class="app-nav">
        <a href="index.html" class="active">Track Order</a>
        <a href="login.html">Staff Login</a>
    </nav>
</header>


<main class="container narrow">

    <section class="panel">

        <h2>Track Your Order</h2>

        <form id="track-form">

            <label for="order-number">Order Number</label>
            <input
                id="order-number"
                name="orderNumber"
                type="text"
                placeholder="e.g. DOT-7K3P9Q"
                maxlength="10"
                autocomplete="off"
                required
            >

            <div id="turnstile-widget" class="cf-turnstile"></div>

            <button type="submit">Track</button>

        </form>

        <p id="track-message" aria-live="polite"></p>

    </section>


    <section id="tracking-loading" class="panel hidden">
        <div class="loading">Loading...</div>
    </section>


    <section id="tracking-result" class="panel tracking-result hidden">

        <h2>Order <span id="result-order-number" class="order-number"></span></h2>

        <span id="result-status" class="badge"></span>

        <p id="result-updated" class="muted"></p>

        <h3>Timeline</h3>
        <ol id="status-timeline" class="timeline"></ol>

    </section>

</main>


<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/tracking.js" defer></script>

</body>
</html>
