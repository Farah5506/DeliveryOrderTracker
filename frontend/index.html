<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Order Tracker - Couriers</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="app-header">
    <h1>Delivery Order Tracker</h1>
    <p>Manage couriers and their availability.</p>
</header>

<main class="container">

    <!-- Add Courier Section -->
    <section class="panel">
        <h2>Add New Courier</h2>

        <form id="courier-form">

            <label for="name">Courier Name</label>
            <input
                id="name"
                name="name"
                type="text"
                placeholder="Enter courier name"
                required
            >

            <label for="email">Email Address</label>
            <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter courier email"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                id="phone"
                name="phone"
                type="tel"
                placeholder="Enter phone number"
                required
            >

            <label for="vehicle">Vehicle Type</label>
            <select id="vehicle" name="vehicle" required>
                <option value="">Select vehicle</option>
                <option value="Motorcycle">Motorcycle</option>
                <option value="Car">Car</option>
                <option value="Bicycle">Bicycle</option>
                <option value="Van">Van</option>
            </select>

            <button type="submit">Add Courier</button>

        </form>

        <p id="form-message" aria-live="polite"></p>
    </section>


    <!-- Current Couriers Section -->
    <section class="panel">

        <h2>Registered Couriers</h2>

        <p>
            <strong>Total Couriers:</strong>
            <span id="courier-count">0</span>
        </p>

        <div id="couriers-list">
            <!-- Courier information will appear here using JavaScript -->
        </div>

    </section>

</main>

<!-- Load configuration before the application JavaScript -->
<script src="js/config.js" defer></script>
<script src="js/couriers.js" defer></script>

</body>
</html>
