<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delivery Order Tracker - Login</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
</head>

<body>

<header class="app-header">
    <h1>Delivery Order Tracker</h1>
    <p>Welcome! Please log in to continue.</p>

    <nav class="app-nav">
        <a href="index.html">Track Order</a>
        <a href="login.html" class="active">Staff Login</a>
    </nav>
</header>


<main class="container narrow">

    <section class="panel">

        <h2>Login</h2>

        <form id="login-form">

            <label for="email">Email Address</label>

            <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">Password</label>

            <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                required
            >


            <div id="turnstile-widget" class="cf-turnstile"></div>

            <button type="submit">Login</button>

        </form>

        <p id="login-message" aria-live="polite"></p>

    </section>

</main>


<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/auth.js" defer></script>

</body>
</html>
