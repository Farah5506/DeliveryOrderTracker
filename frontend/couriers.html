<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Order Tracker - Couriers</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="app-header">
    <h1>Delivery Order Tracker</h1>
    <p>Manage couriers and their availability.</p>

    <nav class="app-nav">
        <a href="dispatcher.html">Orders</a>
        <a href="couriers.html" class="active">Couriers</a>
        <button type="button" id="logout-button">Logout</button>
    </nav>
</header>


<main class="container two-col">

    <section class="panel">

        <h2>Add New Courier</h2>

        <form id="courier-form">

            <label for="name">Courier Name</label>
            <input
                id="name"
                name="name"
                type="text"
                placeholder="Enter courier name"
                minlength="2"
                required
            >

            <label for="email">Email Address</label>
            <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter courier email"
                required
            >

            <label for="password">Temporary Password</label>
            <input
                id="password"
                name="password"
                type="password"
                placeholder="At least 8 characters"
                minlength="8"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                id="phone"
                name="phone"
                type="tel"
                placeholder="Enter phone number"
                required
            >

            <label for="vehicle">Vehicle Type</label>
            <select id="vehicle" name="vehicle" required>
                <option value="">Select vehicle</option>
                <option value="bike">Bicycle</option>
                <option value="motorcycle">Motorcycle</option>
                <option value="car">Car</option>
                <option value="van">Van</option>
            </select>

            <button type="submit">Add Courier</button>

        </form>

        <p id="form-message" aria-live="polite"></p>

    </section>


    <section class="panel">

        <div class="panel-header">
            <h2>Registered Couriers</h2>
            <span class="muted">Total: <span id="courier-count">0</span></span>
        </div>

        <form id="courier-filter-form" class="filters">

            <input
                id="courier-search"
                name="q"
                type="search"
                placeholder="Search by name or email"
            >

            <select id="courier-availability" name="availability">
                <option value="">All</option>
                <option value="available">Available</option>
                <option value="off_duty">Off duty</option>
            </select>

            <button type="submit" class="btn-small">Filter</button>

        </form>

        <div id="couriers-loading" class="loading hidden">Loading couriers...</div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Vehicle</th>
                        <th>Availability</th>
                        <th>Active Orders</th>
                        <th>Account</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="couriers-list">
                </tbody>
            </table>
        </div>

        <p id="couriers-empty" class="empty-state hidden">No couriers yet.</p>

        <p id="list-message" aria-live="polite"></p>

    </section>

</main>


<!-- Edit courier -->
<div id="courier-edit-modal" class="modal">
    <div class="modal-content">

        <div class="panel-header">
            <h2>Edit Courier</h2>
            <button type="button" class="btn-small btn-secondary" data-close="courier-edit-modal">Close</button>
        </div>

        <form id="courier-edit-form">

            <input id="edit-courier-id" name="id" type="hidden">

            <label for="edit-phone">Phone Number</label>
            <input id="edit-phone" name="phone" type="tel" required>

            <label for="edit-vehicle">Vehicle Type</label>
            <select id="edit-vehicle" name="vehicle" required>
                <option value="bike">Bicycle</option>
                <option value="motorcycle">Motorcycle</option>
                <option value="car">Car</option>
                <option value="van">Van</option>
            </select>

            <label for="edit-availability">Availability</label>
            <select id="edit-availability" name="availability" required>
                <option value="available">Available</option>
                <option value="off_duty">Off duty</option>
            </select>

            <label for="edit-active">Account</label>
            <select id="edit-active" name="isActive" required>
                <option value="true">Active</option>
                <option value="false">Deactivated</option>
            </select>

            <button type="submit">Save Changes</button>

        </form>

        <p id="edit-message" aria-live="polite"></p>

    </div>
</div>


<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/couriers.js" defer></script>

</body>
</html>
